version: 1
disable_existing_loggers: false

# ── Anchor: noisy third-party logger template ─────────────────────────
_noisy: &noisy
  level: WARNING
  propagate: true

# ── Formatters ───────────────────────────────────────────────────────
formatters:
  standard:
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

  # Rich email format — includes full traceback context
  email_formatter:
    format: |
      Time     : %(asctime)s
      Level    : %(levelname)s
      Logger   : %(name)s
      File     : %(filename)s line %(lineno)d
      Function : %(funcName)s
      ----------------------------------------
      %(message)s
    datefmt: "%Y-%m-%d %H:%M:%S"

# ── Filters ──────────────────────────────────────────────────────────
filters:
  exact_debug:
    (): src.logger.ExactLevelFilter
    level: 10

  exact_info:
    (): src.logger.ExactLevelFilter
    level: 20

  exact_warning:
    (): src.logger.ExactLevelFilter
    level: 30

  exact_critical:
    (): src.logger.ExactLevelFilter
    level: 50                             # Only CRITICAL — not ERROR

# ── Handlers ─────────────────────────────────────────────────────────
handlers:
  debug_file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: standard
    filters: [exact_debug]
    filename: logs/debug.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8

  info_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: standard
    filters: [exact_info]
    filename: logs/info.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8

  warning_file:
    class: logging.handlers.RotatingFileHandler
    level: WARNING
    formatter: standard
    filters: [exact_warning]
    filename: logs/warning.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8

  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: standard
    filename: logs/error.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8

  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: standard
    stream: ext://sys.stdout

  # Handler to send ALERT → Email
  email:
    class: logging.handlers.SMTPHandler
    level: CRITICAL
    formatter: email_formatter
    filters: [exact_critical]          # Remove this line to also catch ERROR
    mailhost:
      - smtp.gmail.com                 # SMTP server host
      - 587                            # TLS port (use 465 for SSL)
    fromaddr: [FROM_EMAIL_ADDRESS]
    toaddrs:
      - [TO_EMAIL_ADDRESS]
    subject: "[CRITICAL] %(name)s — %(message)s"
    credentials:
      - [SMTP_USER]                    # SMTP username
      - [SMTP_PASSWORD]                # Use env var — see note below
    secure: []                         # Empty list = use STARTTLS on port 587

# ── Noisy third-party loggers ─────────────────────────────────────────
loggers:
  httpx:                                        *noisy
  gunicorn:                                     *noisy
  uvicorn:                                      *noisy
  uvicorn.access:
    <<: *noisy
    level: ERROR
  mcp.client.sse:                               *noisy
  primp:                                        *noisy
  langchain_aws.chat_models.bedrock_converse:   *noisy

# ── Root logger ───────────────────────────────────────────────────────
root:
  level: INFO
  handlers: [debug_file, info_file, warning_file, error_file, console, email]